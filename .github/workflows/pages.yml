# The game on the web (GitHub Pages): the front page (web/index.html, Khmer + English, with
# play buttons) at the root, the game under /play/ (opened offline: no TikTok bridge on the
# web), the phone page at /play/mobile.html (also the iPhone web app, D73).
# In the repository: Settings → Pages → Source: "GitHub Actions". Every push to main updates it.
name: Web game (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run build -w @temples/game
      - name: Assemble the site
        run: |
          mkdir -p site/play
          cp -r web/. site/
          cp -r apps/game/dist/. site/play/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
